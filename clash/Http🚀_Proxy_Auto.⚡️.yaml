secret: ""
unified-delay: false
geodata-mode: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 300
keep-alive-idle: 20
interface-name: en0,wlan0
routing-mark: 6666
geosite-matcher: standard
global-client-fingerprint: chrome
geo-auto-update: true
geo-update-interval: 24
dns:
