lan-allowed-ips:
  - 0.0.0.0/0
lan-disallowed-ips:
  - 198.18.0.3/32
allow-lan: true
bind-address: "*/192.168.1.1/[::1]"
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
external-controller-tls: 127.0.0.1:9443
external-doh-server: /dns-query
external-controller-cors:
